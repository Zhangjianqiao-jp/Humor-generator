schema_version: 1
memory_id: humor_generator_v35
scope: v3.5_only

project:
  objective: >-
    Determine whether structured continuous communication from a frozen 7B
    humor Planner improves a frozen 7B image-caption Generator relative to
    strong text and training-free latent baselines.
  research_question: >-
    Can a typed learned latent bridge transmit grounding, conflict, and
    associative-imagination information more effectively than Text-HOMER,
    budget-matched text/token controls, and StateBridge without reducing image
    grounding or absolute humor quality?
  non_goals:
    - Do not import or execute v2.5 or v3.0 pipelines.
    - Do not jointly train the Planner and Generator in the first study.
    - Do not run preference learning before stable bridge benefit is established.
    - Do not claim latent superiority from reconstruction loss or diversity alone.
    - DPO/preference learning is a legacy v2.5 proposal and is disabled in the current v3.5 latent study.
  current_scope: >-
    Latent-only semantic communication: validate and train the Planner-to-Generator bridge first;
    caption-level preference learning is outside the current executable scope.

architecture:
  planner:
    base: Qwen/Qwen2.5-VL-7B-Instruct
    revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
    adapter: artifacts/checkpoints/planner_sft
    frozen: true
    outputs: [grounding_description, conflict_scripts, local_association, global_association]
  generator:
    base: Qwen/Qwen2.5-VL-7B-Instruct
    revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
    adapter: artifacts/checkpoints/generator_sft
    frozen: true
    receiver_primary: sft
    visual_token_budget: {min: 256, max: 1280, shared_across_all_conditions: true}
  bridge:
    only_trainable_component: true
    communication_state: teacher_forced_post_token
    total_slots: 24
    typed_slots: {conflict: 8, local_association: 8, global_association: 8}
    phase_a3_bottleneck_dim: 48
    deferred_caption_pilot_bottleneck_dim: 256

data_contract:
  split_unit: NYCC_image_cluster
  manifest: data/processed/latent_bridge_v35/manifest.json
  manifest_sha256: c26c5999645d01089a937d0cb86e1982ccd4ea737f807fa698e398279a7197d8
  splits:
    train: 602
    validation: 64
    internal_test: 97
    official_hia_unseen_test: 24
    official_hia_seen_diagnostic: 23
  primary_confirmatory_images: 121
  leakage_contract:
    - Split by image cluster, never caption row.
    - Official HIA test clusters never fit the bridge.
    - The 23 adapter-seen official images are diagnostic only.
  exhaustive_preflight:
    rows: 2846
    unique_images: 949
    upstream_source_files: 367
    image_clusters: 810
    planner_traces: 666
    policy: compile_and_cli_smoke_then_byte_schema_decode_tensor_provenance_audit

trace_contract:
  index: data/cache/planner_traces_homer_strict_v35/index.jsonl
  required_clusters: 666
  required_schema: 3
  validation:
    - At least two explicit conflict pairs.
    - Every association is exactly root-to-step1-to-step2-to-step3.
    - Hidden states and replayed emitted tokens align without trimming or padding.
    - Model revision, adapter, prompts, seed, generation and tensor hashes are recorded.
  validator_repair:
    policy: validator-feedback-format-only-v1
    constraints:
      - Preserve semantic strings exactly.
      - Replay repaired text under the original HOMER prompt.
      - Record both invalid and repaired outputs and repair provenance.

conditions:
  text:
    - text_homer
    - full_plan_text
    - budget_text
  training_free_latent:
    - token_embedding
    - statebridge
  learned:
    - learned_kl
    - typed_kl
    - typed_no_kl
    - typed_quantized
  fairness:
    - Learned and Typed bridges have equal trainable parameter counts.
    - All communication controls use a 24-slot budget where applicable.
    - All text, training-free latent, and learned conditions use the same 256--1280 visual-token budget.
    - StateBridge three-channel 24-slot mode is labelled an adaptation, not an exact reproduction.

experiment_plan:
  phases:
    - id: E
      name: engineering_smoke
      status: complete
      evidence: docs/ENGINEERING_SMOKE_REPORT_ZH.md
    - id: T
      name: formal_train_validation_traces
      status: complete
      exit_gate: exactly_666_validated_traces
      evidence: data/cache/planner_traces_homer_strict_v35/index.jsonl
    - id: R
      name: corrected_legacy_bridge_counterfactual_review
      status: complete_inconclusive
      evidence: docs/SEMANTIC_REEVALUATION_RESULTS_ZH.md
      output: outputs/re_evaluation/semantic_v1_corrected/summary.json
      design: {methods: [v1, v2], clusters: 24, protocol: length_matched_single_channel_swap}
    - id: A3S
      name: phase_a3_replacement_engineering_smoke
      status: complete
      config: configs/pilot/cross_attention_semantic_phase_a3.yaml
      failed_attempt: "6689653"
      failure_record: docs/EXPERIMENT_FAILURES.jsonl
      expected_output: results/engineering_smoke/cross_attention_semantic_phase_a3.json
      gate: real_trace_two_sample_forward_backward_and_validator
      completed_job: "6706516"
      evidence:
        - v35_a3_smoke.6706516.out
        - v35_a3_smoke.6706516.stats
        - results/engineering_smoke/cross_attention_semantic_phase_a3.json
      result: >-
        Passed on one full H100 with max_target_tokens=768; policy remained frozen,
        bridge gradients/update were finite and non-zero, and contextual InfoNCE plus
        channel-wise counterfactual paths executed. This is an engineering gate only.
    - id: A3
      name: channel_balanced_semantic_recovery_pilot
      status: complete_pilot_inconclusive
      config: configs/pilot/cross_attention_semantic_phase_a3.yaml
      budget: {train_clusters: 64, validation_clusters: 24, seeds: 1}
      trainable: bridge_only
      frozen: [planner_7b, generator_7b]
      job_id: "6707953"
      output: outputs/pilot/cross_attention_semantic_phase_a3
      engineering_gate: pass
      semantic_gate: pilot_inconclusive
      final_validation:
        total: 3.001369272338019
        caption_nll: 1.129462348090278
        matched_minus_shuffled_logp: 0.00021642053292857276
        info_nce_retrieval_at_1: 0.5347222685813904
      channel_gaps:
        conflict: -0.00003976126511891683
        local: -0.0003169911603132884
        global: 0.0010060140242179234
      interpretation: >-
        Engineering-valid mechanism pilot; 24-cluster channel-wise bootstrap intervals
        cross zero, so it neither proves nor rejects latent communication.
    - id: O
      name: outer_semantic_confirmation
      status: real_trace_smoke_queued
      design: {clusters: 40, shared_seeds: 3, statistical_unit: image_cluster}
      script: scripts/run_outer_semantic_confirmation.py
      output: outputs/outer_semantic_confirmation/a3_outer40
      smoke_job_id: "6708044"
      smoke_resource_group: c-batch
      smoke_elapse_seconds: 300
      smoke_estimated_start: "2026-09-04T11:00:00+09:00"
      preflight: results/preflight/outer_confirmation_preflight.json
    - id: L
      name: latent_text_caption_ablation
      status: evidence_gated
      conditions: [text_homer, c_text_a_latent, c_latent_a_text, all_latent]
      design: {primary_images: 121, candidates_per_image: 10, group_size: 10}
    - id: C
      name: confirmatory_latent_training_and_test
      status: locked_until_L_go
      design: {full_train_clusters: 602, validation_clusters: 64, seeds: 3, primary_test_images: 121}
    - id: PL
      name: legacy_preference_learning
      status: disabled_in_v3_5
      note: DPO/SimPO/IPO belong to the superseded preference plan and must not be auto-submitted.

evaluation:
  pilot:
    protocol: mirrored_blind_group_of_3
    statistical_unit: image_cluster
    role: screening_only
  confirmatory:
    protocol: mirrored_blind_group_of_10
    statistical_unit: image_cluster
    raters: multiple_independent
    uncertainty: hierarchical_image_rater_bootstrap_95ci
  required_metrics:
    - overall_win_rate
    - best_pick_win_rate
    - absolute_good_weak_bad
    - humor
    - grounding
    - originality
    - specificity
    - hallucination
    - generic_template_rate
    - good_only_diversity
    - human_angle_coverage

decision_rules:
  pilot_go_requires:
    - Validation NLL does not regress.
    - Matched versus hard-negative semantic margin improves.
    - Outer-validation generation does not regress against Text-HOMER and StateBridge.
    - Grounding, hallucination, and absolute good rate do not regress.
  confirmatory_claim_requires:
    - Directionally consistent results across at least three seeds.
    - Image-clustered confidence intervals and multiple-rater analysis.
    - Quality-preserving diversity gains on the good-caption subset.
  no_go:
    - Stop bridge scaling if pilot gains exist only in loss-space.
    - Do not use DPO to rescue an unproven communication mechanism.

resource_policy:
  priority: earliest_safe_start
  rules:
    - Query all legal GPU groups before accepting a delayed reservation.
    - Prefer available MIG slices when model smoke confirms sufficient memory.
    - Keep at most one active copy after a faster duplicate reaches RUN.
    - Serialize pilots so released resources can be reused immediately.
    - Never increase resource requests merely for safety margin.
    - MIG is forbidden for formal bridge training after both multi-slice and single-slice allocator failures on pilot data.
    - A smoke must exercise the exact pilot placement and a representative high-cost visual sample; a convenient first-row smoke is insufficient.
    - Formal bridge jobs use one full GPU, a fixed device map to CUDA device 0, and the native PyTorch allocator.

authoritative_references:
