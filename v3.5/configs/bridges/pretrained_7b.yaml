experiment:
  name: pretrained_7b_bridge
  formal_training_enabled: false
  route: homer_public_code_bridge
  prompt_track: public_code_exact_caption_latent_plan_replacement_v1
  receiver: pretrained_qwen_7b
  model_route: pretrained_only
  trainable_components: [bridge]

protocol:
  bridge_prompt_track: public_code_exact_caption_latent_plan_replacement_v1
  training_target_policy: source_caption_only_no_fabricated_explanation
  caption_contract: ["##Caption", "##Explanation"]

model:
  name: Qwen/Qwen2.5-VL-7B-Instruct
  revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
  model_manifest: manifests/local_qwen2_5_vl_7b.json
  adapter: null
  planner_adapter: null
  generator_adapter: null
  frozen: true
  gradient_checkpointing: true
  use_cache: false
  min_visual_tokens: 256
  max_visual_tokens: 1280
  receiver_image: false

baselines: [text_homer_public_code, statebridge, learned_latent, typed_learned_latent]

data:
  data_version: homer_pretrained_7b_public_release_362
  dataset: data/processed/homer_pretrained_7b_bridge_362
  population_manifest: manifests/homer_population_public_release_362.json
  trace_input_manifest: data/processed/homer_pretrained_7b_public_release_362/trace_inputs.jsonl
  trace_index: data/cache/homer_pretrained_7b_planner_traces/index.jsonl
  context_index: data/cache/homer_pretrained_7b_homer_context/index.jsonl
  # This training view is built only after 362/362 traces and contexts pass;
  # final HOMER evaluation reads complete ranking CSVs instead.
  caption_view_policy: public_release_source_rows_top3_for_bridge_training_only
  target_policy: source_caption_only_no_fabricated_explanation

bridge:
  sender_fields: [conflict, local, global]
  bottleneck_dim: 256
  total_slots: 24
  slots_per_channel: 8
  heads: 8
  statebridge_regularization: 0.001
  statebridge_snap_ratio: 0.3

loss:
  caption_nll: 1.0
  text_teacher_forward_kl: 0.5
  matched_shuffled_margin: 0.1
  margin: 0.2
  temperature: 1.0

training:
  planner_route: pretrained_7b
  generator_route: pretrained_7b
  bridge_only: true
  planner_frozen: true
  generator_frozen: true

smoke:
  max_examples: 2
  max_optimizer_steps: 1
  max_sequence_tokens: 1024
  caption_only_logits: true
  require_peak_memory_report: true
