experiment:
  name: pilot_hierarchical_cross_attention_semantic_reconstruction
  baseline: receiver_cross_attention
  receiver: sft_qwen_7b
model:
  name: Qwen/Qwen2.5-VL-7B-Instruct
  revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
  adapter: artifacts/checkpoints/generator_sft
  frozen: true
  min_visual_tokens: 256
  max_visual_tokens: 1280
data:
  dataset: data/processed/latent_bridge_v35
  trace_index: data/cache/planner_traces_homer_strict_v35/index.jsonl
bridge:
  layer_indices: [6, 13, 20, 27]
  bottleneck_dim: 48
  heads: 4
  gate_init: 0.1
  memory_policy: full_typed_states_no_truncation
loss:
  caption_nll: 1.0
  text_teacher_forward_kl: 0.0
  matched_shuffled_margin: 0.5
  info_nce: 0.25
  info_nce_temperature: 0.07
  variance_floor: 0.05
  margin: 0.2
  temperature: 1.0
training:
  stage: semantic_reconstruction
  seed: 20260830
  epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.01
  gradient_accumulation: 4
  max_grad_norm: 1.0
  max_target_tokens: 768
  early_stopping_patience: 2
  early_stopping_min_delta: 0.002
  log_every_examples: 8
  max_train_clusters: 64
  max_validation_clusters: 24
gate:
  min_validation_gap: 0.02
  min_fraction_gap_gt_0: 0.60
  min_nll_improvement: 0.02
  max_relative_update_norm: 0.25
  min_validation_info_nce_retrieval_at_1: 0.20
