# Read-only diagnostic configuration for the deployed 3B caption policy.
# This file does not authorize training and does not select a DPO objective.
model:
  model_name: "Qwen/Qwen2.5-VL-3B-Instruct"
  adapter_dir: "outputs/newyorker_compact_v2_captioner_3b_qlora/best_val_loss"
  device_map: "auto"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    bias: "none"

data:
  max_seq_len: 768
  image_max_pixels: 200704
  preference_pairs: "results/preference_diagnostics/current_rank_pairs/pairs.jsonl"
  held_out_images: "data/processed/newyorker_hic_compact_json_test/test_images_unique.jsonl"
  joint_inputs: "outputs/newyorker_caption_aware_v3_joint_vs_direct_eval/inputs_final.jsonl"

generation:
  do_sample: true
  temperature: 0.8
  top_p: 0.9
  top_k: 0
  max_new_tokens: 48
  repetition_penalty: 1.05
  candidate_batch_size: 4
  seed: 20260824
  n_values: [1, 2, 4, 8, 16, 32]

diagnostics:
  policy_scope: "captioner"
  best_of_n_good_threshold: 4.0
  image_shuffle_max_pairs_smoke: 2
  module_gradient_max_pairs_smoke: 1
  warning: >-
    This diagnoses the 3B caption policy. Planner-policy preference learning
    requires image-to-plan chosen/rejected data and a separate 7B config.
