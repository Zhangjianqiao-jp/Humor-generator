# LoRA-SFT pilot for HIC compact-JSON guided prompts.
# First create the train/val viewpoint JSONL files with
# scripts/analyze_hic_humor_viewpoints.py. The same JSONL files are used as
# SFT rows and as context so caption-specific row_key matching is exact.

model:
  model_name: "/home/zhang.jianqiao/models/Qwen2.5-VL-3B-Instruct"
  device_map: "auto"
  torch_dtype: "auto"
  trust_remote_code: true

  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    bias: "none"

data:
  train_path: "outputs/analysis/hic_humor_viewpoints_sft_train_pilot.jsonl"
  val_path: "outputs/analysis/hic_humor_viewpoints_sft_val_pilot.jsonl"
  train_context_path: "outputs/analysis/hic_humor_viewpoints_sft_train_pilot.jsonl"
  val_context_path: "outputs/analysis/hic_humor_viewpoints_sft_val_pilot.jsonl"
  image_root: null
  max_seq_len: 1024
  max_caption_chars: 240
  min_supervised_tokens: 3
  skip_missing_images: true
  normalize_prompt: true
  sft_prompt: "Generate one short, natural, image-specific humorous caption for this image. Do not explain."
  feature_method: "hic-compact-json"
  require_context: true

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 1
  learning_rate: 0.00005
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 260704

  gradient_checkpointing: true
  bf16: true
  fp16: false
  optim: "adamw_torch"

  logging_steps: 2
  eval_steps: 16
  save_steps: 16
  save_total_limit: 2

generation:
  max_new_tokens: 48
  temperature: 0.8
  top_p: 0.9
  do_sample: true
  num_candidates: 5
  repetition_penalty: 1.05

evaluation:
  fixed_generation_samples: 5
  max_eval_samples: 128

output:
  output_dir: "outputs/lora_sft_hic_compact_json_pilot"
  latest_adapter_dir: "outputs/lora_sft_hic_compact_json_pilot/latest"
  best_adapter_dir: "outputs/lora_sft_hic_compact_json_pilot/best_val_loss"
  final_adapter_dir: "outputs/lora_sft_hic_compact_json_pilot/final_lora"
  tensorboard_dir: "outputs/lora_sft_hic_compact_json_pilot/tensorboard"
