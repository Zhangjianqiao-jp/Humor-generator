# V2.5 VLM-guided humorous caption generation config.
# This pipeline does not change generator weights. It first extracts conservative
# visual facts and structured humor guidance with Qwen2.5-VL-7B, then feeds the
# selected rendered guidance to the base Qwen2.5-VL-3B generator.

extractor:
  model_name: "/home/zhang.jianqiao/models/Qwen2.5-VL-7B-Instruct"
  device_map: "auto"
  torch_dtype: "auto"
  trust_remote_code: true
  mode: "both"
  visual_facts_temperature: 0.0
  visual_facts_max_new_tokens: 384
  structured_humor_prompt_version: "structured-v1"
  structured_humor_temperature: 0.0
  structured_humor_max_new_tokens: 768

generator:
  model_name: "/home/zhang.jianqiao/models/Qwen2.5-VL-3B-Instruct"
  adapter_dir: null
  device_map: "auto"
  torch_dtype: "auto"
  trust_remote_code: true
  base_prompt: "Generate one short, natural, image-specific humorous caption for this image. Do not explain."
  num_candidates: 8
  max_new_tokens: 48
  temperature: 0.8
  top_p: 0.9
  repetition_penalty: 1.05
  seed: 250618

data:
  input_jsonl: "data/processed/sft_test.jsonl"
  image_root: null
  limit: 100

output:
  context_jsonl: "outputs/analysis/vlm_structured_humor_100.jsonl"
  description_only_jsonl: "outputs/generations/vlm_guided_description_only_100.jsonl"
  prompt_method_jsonl: "outputs/generations/vlm_guided_prompt_method_100.jsonl"
  feature_method_jsonl: "outputs/generations/vlm_guided_feature_method_100.jsonl"
  structured_brief_jsonl: "outputs/generations/vlm_guided_structured_brief_100.jsonl"
  structured_nl_jsonl: "outputs/generations/vlm_guided_structured_nl_100.jsonl"
  structured_json_jsonl: "outputs/generations/vlm_guided_structured_json_100.jsonl"
  description_only_html: "outputs/reviews/vlm_guided_description_only_100.html"
  prompt_method_html: "outputs/reviews/vlm_guided_prompt_method_100.html"
  feature_method_html: "outputs/reviews/vlm_guided_feature_method_100.html"
  structured_brief_html: "outputs/reviews/vlm_guided_structured_brief_100.html"
  structured_nl_html: "outputs/reviews/vlm_guided_structured_nl_100.html"
  structured_json_html: "outputs/reviews/vlm_guided_structured_json_100.html"

training:
  train_context_jsonl: "outputs/analysis/vlm_structured_humor_train.jsonl"
  val_context_jsonl: "outputs/analysis/vlm_structured_humor_val.jsonl"
  method: "structured-brief"
