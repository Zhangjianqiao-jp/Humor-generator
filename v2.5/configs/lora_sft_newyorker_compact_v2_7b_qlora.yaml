# Clean-v2 planner: complete first-sentence ANCHOR/CONTRAST labels.
model:
  model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  device_map: "auto"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true
  lora:
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    bias: "none"

data:
  train_path: "data/processed/newyorker_compact_sft_v2/planner_train.jsonl"
  val_path: "data/processed/newyorker_compact_sft_v2/planner_validation.jsonl"
  image_root: null
  image_max_pixels: 200704
  max_seq_len: 512
  max_caption_chars: 320
  min_supervised_tokens: 3
  skip_missing_images: false
  normalize_prompt: false
  sample_one_caption_per_image: false

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 30
  learning_rate: 0.00002
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"
  logging_steps: 10
  eval_steps: 25
  save_steps: 25
  save_total_limit: 3
  save_hours: 2

generation:
  max_new_tokens: 96
  preserve_newlines: true
  temperature: 0.3
  top_p: 0.9
  do_sample: false
  repetition_penalty: 1.05

evaluation:
  fixed_generation_samples: 5
  max_eval_samples: null

output:
  output_dir: "outputs/newyorker_compact_v2_planner_7b_qlora"
  latest_adapter_dir: "outputs/newyorker_compact_v2_planner_7b_qlora/latest"
  best_adapter_dir: "outputs/newyorker_compact_v2_planner_7b_qlora/best_val_loss"
  final_adapter_dir: "outputs/newyorker_compact_v2_planner_7b_qlora/final_lora"
  tensorboard_dir: "outputs/newyorker_compact_v2_planner_7b_qlora/tensorboard"
