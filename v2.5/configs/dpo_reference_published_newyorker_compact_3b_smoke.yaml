model:
  model_name: "Qwen/Qwen2.5-VL-3B-Instruct"
  reference_adapter_dir: "outputs/newyorker_compact_v2_captioner_3b_qlora/best_val_loss"
  device_map: "auto"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    bias: "none"

data:
  train_path: "data/processed/newyorker_published_dpo_pairs/train_selected.jsonl"
  validation_path: "data/processed/newyorker_published_dpo_pairs/validation_selected.jsonl"
  test_path: "data/processed/newyorker_published_dpo_pairs/test_selected.jsonl"
  batch_size: 1
  image_max_pixels: 200704
  max_seq_len: 768
  skip_missing_images: false

output:
  output_dir: "data/processed/newyorker_published_dpo_reference_3b_smoke"
