# Prepared baseline only. Run after reference-logp smoke and the published-pair
# audit; this file does not itself submit or start DPO.
model:
  model_name: "Qwen/Qwen2.5-VL-3B-Instruct"
  sft_adapter_dir: "outputs/newyorker_compact_v2_captioner_3b_qlora/best_val_loss"
  device_map: "auto"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    bias: "none"

data:
  train_path: "data/processed/newyorker_published_dpo_reference_3b/dpo_train.jsonl"
  val_path: "data/processed/newyorker_published_dpo_reference_3b/dpo_validation.jsonl"
  image_max_pixels: 200704
  max_seq_len: 768

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 10
  learning_rate: 0.000005
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  max_grad_norm: 1.0
  beta: 0.1
  seed: 2024
  gradient_checkpointing: true
  logging_steps: 5
  eval_steps: 25

output:
  output_dir: "outputs/newyorker_published_dpo_captioner_3b"
  latest_adapter_dir: "outputs/newyorker_published_dpo_captioner_3b/latest"
  best_adapter_dir: "outputs/newyorker_published_dpo_captioner_3b/best_eval_dpo_loss"
  final_adapter_dir: "outputs/newyorker_published_dpo_captioner_3b/final_lora"
