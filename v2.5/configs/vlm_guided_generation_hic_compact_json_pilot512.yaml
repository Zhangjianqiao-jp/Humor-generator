# Evaluate the 512-sample HIC compact-json LoRA pilot on held-out SFT rows.

generator:
  model_name: "/home/zhang.jianqiao/models/Qwen2.5-VL-3B-Instruct"
  adapter_dir: "outputs/lora_sft_hic_compact_json_pilot_512/final_lora"
  device_map: "auto"
  torch_dtype: "auto"
  trust_remote_code: true
  base_prompt: "Generate one short, natural, image-specific humorous caption for this image. Do not explain."
  num_candidates: 8
  max_new_tokens: 48
  temperature: 0.8
  top_p: 0.9
  repetition_penalty: 1.05
  seed: 250618

data:
  input_jsonl: "data/processed/sft_test.jsonl"
  image_root: null
  limit: 200

output:
  context_jsonl: "outputs/analysis/hic_humor_viewpoints_sft_test_full.jsonl"
  hic_compact_json_jsonl: "outputs/generations/hic_compact_json_pilot512_sft_test_200.jsonl"
  hic_compact_json_html: "outputs/reviews/hic_compact_json_pilot512_sft_test_200.html"
