experiment:
  name: 7b_generator_dpo_quality64_full
  phase: controlled_preference_scaling

model:
  model_name: Qwen/Qwen2.5-VL-7B-Instruct
  sft_adapter_dir: outputs/7b-generator/best_val_loss
  adapter_strategy: continue_sft
  device_map: auto
  torch_dtype: bfloat16
  trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
  lora:
    rank: 3
    alpha: 6
    dropout: 0.05
    target_modules: [gate_proj, up_proj, down_proj]
    bias: none

data:
  train_path: data/processed/newyorker_published_dpo_reference_7b_generator_quality64/dpo_train.jsonl
  # Keep the Pilot16 validation distribution fixed; test47 stays sealed.
  val_path: data/processed/newyorker_published_dpo_reference_7b_generator/dpo_validation.jsonl
  train_sampling: all_pairs
  validation_sampling: all_pairs
  image_max_pixels: 200704
  max_seq_len: 768

objective:
  name: dpo
  beta: 0.1

training:
  # Same effective batch of 8 as the pilot, packed for a full H100.
  batch_size: 4
  gradient_accumulation_steps: 2
  num_epochs: 1
  learning_rate: 0.000002
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 20260825
  gradient_checkpointing: true
  logging_steps: 20
  # These correspond to about 1x, 4x, 8x, and 13.7x the 158-step pilot.
  # The final point is one complete traversal of all 17,297 pairs.
  eval_steps: 0
  eval_milestones: [158, 632, 1264, 2163]
  cluster_bootstrap_samples: 5000
  early_stopping:
    enabled: true
    metric: eval_image_mean_loss
    mode: min
    min_delta: 0.0002
    patience: 2

output:
  output_dir: outputs/7b-generator-dpo/dpo_mlp_quality64_full
  latest_adapter_dir: outputs/7b-generator-dpo/dpo_mlp_quality64_full/latest
  best_adapter_dir: outputs/7b-generator-dpo/dpo_mlp_quality64_full/best
  final_adapter_dir: outputs/7b-generator-dpo/dpo_mlp_quality64_full/final
