experiment:
  name: 7b_generator_selected_lora_sft
  phase: full_sft_after_module_pilot
model:
  model_name: Qwen/Qwen2.5-VL-7B-Instruct
  device_map: auto
  torch_dtype: bfloat16
  trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
  lora:
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]
    bias: none
data:
  train_path: data/processed/newyorker_compact_sft_v2/caption_train.jsonl
  val_path: data/processed/newyorker_compact_sft_v2/caption_validation.jsonl
  image_root: null
  image_max_pixels: 200704
  max_seq_len: 768
  max_caption_chars: 220
  min_supervised_tokens: 3
  skip_missing_images: false
  normalize_prompt: false
  sample_one_caption_per_image: true
  sample_one_caption_per_image_val: true
training:
  batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 40
  learning_rate: 0.00002
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 31415
  gradient_checkpointing: true
  bf16: true
  fp16: false
  optim: paged_adamw_8bit
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  save_total_limit: 3
  save_hours: 1
generation:
  max_new_tokens: 48
  temperature: 0.8
  top_p: 0.9
  do_sample: true
  repetition_penalty: 1.05
evaluation:
  fixed_generation_samples: 0
  max_eval_samples: null
output:
  output_dir: outputs/7b-generator
  latest_adapter_dir: outputs/7b-generator/latest
  best_adapter_dir: outputs/7b-generator/best_val_loss
  final_adapter_dir: outputs/7b-generator/final_lora
  tensorboard_dir: outputs/7b-generator/tensorboard
