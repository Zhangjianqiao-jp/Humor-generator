# Frozen 7B SFT reference log-probabilities for the Quality64 training pool.
# The test split remains sealed and is not processed by the current job.
model:
  model_name: Qwen/Qwen2.5-VL-7B-Instruct
  reference_adapter_dir: outputs/7b-generator/best_val_loss
  device_map: auto
  torch_dtype: bfloat16
  trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
  lora:
    rank: 3
    alpha: 6
    dropout: 0.05
    target_modules: [gate_proj, up_proj, down_proj]
    bias: none

data:
  train_path: data/processed/newyorker_published_dpo_pairs_quality64/train_selected.jsonl
  validation_path: data/processed/newyorker_published_dpo_pairs_quality64/validation_selected.jsonl
  test_path: data/processed/newyorker_published_dpo_pairs_quality64/test_selected.jsonl
  batch_size: 8
  image_max_pixels: 200704
  max_seq_len: 768
  skip_missing_images: false

output:
  output_dir: data/processed/newyorker_published_dpo_reference_7b_generator_quality64
