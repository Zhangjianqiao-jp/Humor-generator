# Read-only auxiliary judge configuration for the 7B-only Generator route.
model:
  model_name: Qwen/Qwen2.5-VL-7B-Instruct
  device_map: auto
  torch_dtype: bfloat16
  trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true

data:
  held_out_input: data/processed/preference_objective_eval/fixed_hint_validation.jsonl

generation:
  do_sample: false
  max_new_tokens: 256

diagnostics:
  policy_scope: 7b_generator
  role: auxiliary_multidimensional_judge
  warning: Blind group preference is the primary comparison; this judge is auxiliary.
