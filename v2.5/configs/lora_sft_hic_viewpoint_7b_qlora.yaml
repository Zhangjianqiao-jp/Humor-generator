model:
  model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  device_map: "auto"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true
  lora:
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    bias: "none"

data:
  train_path: "data/processed/newyorker_compact_viewpoint_sft/train.jsonl"
  val_path: "data/processed/newyorker_compact_viewpoint_sft/validation.jsonl"
  image_root: null
  # 128 merged visual tokens (128 * 28 * 28 pixels). The previous 256-token
  # budget peaked at 10.35 GiB and a longer batch hit a cudaMalloc/NVML assert.
  image_max_pixels: 100352
  max_seq_len: 1536
  max_caption_chars: 3000
  min_supervised_tokens: 20
  skip_missing_images: false
  normalize_prompt: false
  sample_one_caption_per_image: false

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 30
  learning_rate: 0.00002
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true
  bf16: true
  fp16: false
  optim: "paged_adamw_8bit"
  logging_steps: 10
  eval_steps: 25
  save_steps: 25
  save_total_limit: 3
  save_hours: 2

generation:
  max_new_tokens: 384
  preserve_newlines: true
  temperature: 0.0
  top_p: 0.9
  do_sample: false
  repetition_penalty: 1.05

evaluation:
  # Long generation in the training process triggered a PyTorch NVML allocator
  # assertion on MIG in job 6464590. Run qualitative generation post-training.
  fixed_generation_samples: 0
  max_eval_samples: null

output:
  output_dir: "outputs/newyorker_compact_viewpoint_7b_qlora"
  latest_adapter_dir: "outputs/newyorker_compact_viewpoint_7b_qlora/latest"
  best_adapter_dir: "outputs/newyorker_compact_viewpoint_7b_qlora/best_val_loss"
  final_adapter_dir: "outputs/newyorker_compact_viewpoint_7b_qlora/final_lora"
  tensorboard_dir: "outputs/newyorker_compact_viewpoint_7b_qlora/tensorboard"
