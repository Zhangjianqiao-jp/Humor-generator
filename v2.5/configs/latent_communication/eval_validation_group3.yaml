experiment:
  name: latent_communication_validation_group3

model:
  model_name: Qwen/Qwen2.5-VL-7B-Instruct
  device_map: auto
  torch_dtype: bfloat16
  load_in_4bit: true

planner:
  adapter_dir: outputs/newyorker_caption_aware_viewpoint_v3_7b_qlora/final_lora
  prompt_file: prompts/7b_image_to_caption_aware_compact_viewpoint.txt
  max_new_tokens: 384
  max_state_tokens: 64

generator:
  adapter_dir: outputs/7b-generator/best_val_loss

bridge:
  checkpoint: outputs/latent_communication/bridge_sft/best.pt

data:
  # Validation only. The sealed official 47-image test is not used in development.
  input_jsonl: data/processed/newyorker_compact_sft_v2/caption_validation.jsonl

generation:
  seeds: [20260828, 20260829, 20260830]
  candidates_per_group: 3
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  max_new_tokens: 64

evaluation:
  comparisons:
    - latent:text
    - hybrid:text
    - hybrid:latent
  primary: latent:text
  cluster_unit: image
  bootstrap_samples: 10000
  absolute_labels: [good, weak, bad]

output:
  output_dir: results/latent_communication/validation_group3
