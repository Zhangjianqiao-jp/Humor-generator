# 7B compact humor planner SFT.  Labels are automatic bootstrap labels and
# must be manually audited before a production run.
model:
  model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  device_map: "auto"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  lora:
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    bias: "none"

data:
  train_path: "data/processed/newyorker_compact_sft/planner_train.jsonl"
  val_path: "data/processed/newyorker_compact_sft/planner_validation.jsonl"
  image_root: null
  # At most 256 Qwen visual tokens.  This must fit alongside the text target
  # within max_seq_len; do not use tokenizer truncation to cut image tokens.
  image_max_pixels: 200704
  max_seq_len: 512
  max_caption_chars: 240
  min_supervised_tokens: 3
  skip_missing_images: false
  normalize_prompt: false
  sample_one_caption_per_image: false

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 30
  learning_rate: 0.00002
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  gradient_checkpointing: true
  bf16: true
  fp16: false
  optim: "adamw_torch"
  logging_steps: 10
  eval_steps: 25
  save_steps: 25
  save_total_limit: 3

generation:
  max_new_tokens: 64
  temperature: 0.3
  top_p: 0.9
  do_sample: false
  repetition_penalty: 1.05

evaluation:
  fixed_generation_samples: 5
  max_eval_samples: null

output:
  output_dir: "outputs/newyorker_compact_planner_7b"
  latest_adapter_dir: "outputs/newyorker_compact_planner_7b/latest"
  best_adapter_dir: "outputs/newyorker_compact_planner_7b/best_val_loss"
  final_adapter_dir: "outputs/newyorker_compact_planner_7b/final_lora"
  tensorboard_dir: "outputs/newyorker_compact_planner_7b/tensorboard"
