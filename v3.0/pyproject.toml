[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humor-generator-v3"
version = "0.1.0"
description = "Evidence-gated HOMER reproduction and latent communication research"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "PyYAML>=6"]

[project.optional-dependencies]
homer = ["nltk>=3.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
