evaluation:
  split: test
  statistical_unit: image_cluster
  test_clusters: 81
  candidates_per_group: 3
  generation_seeds: [20260830, 20260831, 20260832]
  temperature: 1.0
  top_p: 1.0
  repetition_penalty: 1.0
  max_new_tokens: 96
  reference: text_homer
  analysis_control: matched_text
  conditions:
    - text_homer
    - statebridge
    - learned_latent
    - typed_learned_latent
  receivers: [base, sft]
statebridge:
  max_prefix_tokens: 64
  overflow_policy: causal_tail
judge:
  blind_condition_names: true
  randomize_A_B: true
  show_image: true
  show_standard_description: false
  relative_labels: [A, B, Tie]
  absolute_labels: [good, weak, bad]
  candidate_level_absolute_labels_required: true
  text_only_fallback_is_primary_result: false
statistics:
  tie_value: 0.5
  bootstrap_samples: 10000
  confidence_level: 0.95
  report_generation_seed_variance: true
claims:
  system_level: text_homer_vs_latent
  modality_level: matched_text_vs_latent
  preference_learning_enabled: false
references:
  - https://openreview.net/pdf?id=SzaRhPom4o
  - https://aclanthology.org/2026.acl-long.1248/
  - https://arxiv.org/abs/2608.13317
  - https://proceedings.neurips.cc/paper_files/paper/2024/hash/e297fb6cd1690ee5b39c5bb4c58ad801-Abstract-Datasets_and_Benchmarks_Track.html
